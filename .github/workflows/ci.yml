# The gate CONTRIBUTING.md describes, run on every PR and on main: lint + types, course verification
# (the C++ harnesses in shards of their own), production build — independent jobs in parallel, then one
# `CI` job that is the single required status check (branch protection names it; the jobs behind it can
# change without touching settings).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR supersedes the run in flight; runs on main are left to finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn compile

  verify:
    name: Verify courses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Boots Pyodide in Node; its packages (fastapi, protobuf, …) come from jsDelivr at run time.
      - run: yarn verify --runtime python,typescript,go

  # Compiling every C++ program with the clang the browser runs (WebAssembly, one core per compile)
  # takes one runner past half an hour, so the problems are split into balanced shares.
  verify-cpp:
    name: Verify courses in C++ (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Fetches the WASI sysroot (wasi-sdk's release, pinned by digest), compiles the share's C++ programs
      # in parallel across the runner's cores, and runs their harnesses.
      - run: yarn verify --runtime cpp --shard ${{ matrix.shard }}/8

  scala:
    name: Compile Scala
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Scala is judged statically in the browser, so this is what keeps it compiling: scala-cli (pinned by
      # digest) brings the JVM, Scala 2.13 and the libraries the courses use, and compiles each course's
      # solutions as one project, then each starter in its solution's place.
      - run: yarn check:scala

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build

  ci:
    name: CI
    # Runs even when a job above fails or is cancelled: a skipped required check counts as passing.
    if: always()
    needs: [lint, verify, verify-cpp, scala, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
