# The gate CONTRIBUTING.md describes, run on every PR and on main: lint + types, course verification,
# production build — three independent jobs in parallel, then one `CI` job that is the single required
# status check (branch protection names it; the jobs behind it can change without touching settings).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR supersedes the run in flight; runs on main are left to finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn compile

  verify:
    name: Verify courses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Boots Pyodide in Node; its packages (fastapi, protobuf, …) come from jsDelivr at run time.
      - run: yarn verify

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build

  ci:
    name: CI
    # Runs even when a job above fails or is cancelled: a skipped required check counts as passing.
    if: always()
    needs: [lint, verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
