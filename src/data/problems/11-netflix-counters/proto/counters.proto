syntax = "proto3";

package counters;

// The read API other services call (step 5): one unary RPC returning a counter's value and when it was computed.
service CounterService {
  rpc GetCount(GetCountRequest) returns (GetCountReply);
}

message GetCountRequest {
  string namespace = 1;
  string name = 2;
}

message GetCountReply {
  int64 count = 1;
  // Unix seconds at which `count` was computed: a cached eventually-consistent total is as old as this says.
  int64 as_of = 2;
}
