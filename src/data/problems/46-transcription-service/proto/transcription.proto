syntax = "proto3";

package transcribe;

// The ASR provider step 3 calls: it transcribes the span [offset_ms, offset_ms + duration_ms) of an
// audio object (duration_ms 0: to the end of the audio) and streams the segments it finds, in
// order, with absolute timestamps. Audio it cannot decode is INVALID_ARGUMENT.
service Asr {
  rpc TranscribeChunk(ChunkRequest) returns (stream Segment);
}

message ChunkRequest {
  string job_id = 1;
  string audio_ref = 2;
  int32 chunk_index = 3;
  int32 offset_ms = 4;
  int32 duration_ms = 5;
}

message Segment {
  int32 start_ms = 1;
  int32 end_ms = 2;
  string speaker = 3;
  string text = 4;
}
