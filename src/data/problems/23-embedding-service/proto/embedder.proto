syntax = "proto3";

package embedding;

// The model server every vector comes from: one input per call, under a deadline. The checks serve
// a deterministic stand-in at models:9000 (embedding/model in the support modules).
service Embedder {
  rpc Embed(EmbedRequest) returns (EmbedReply);
}

message EmbedRequest {
  string model_version = 1;
  string text = 2;
}

// The model that answered and its vector. A replica still on another model says so here.
message EmbedReply {
  string model_version = 1;
  repeated float values = 2;
}
