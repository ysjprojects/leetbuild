syntax = "proto3";

package calnotify;

// The attendee notifier step 3 calls after an event write commits. In this course it is a stand-in
// served by the harness at notifier:9000: it mails every attendee of a request once per
// idempotency_token (a request whose token it has seen is acknowledged and mails nobody; a request
// without a token mails everyone every time), and the mail an attendee gets is decided by kind:
// "create" is an invitation, "update" a change notice, "cancel" a withdrawal.
service Notifier {
  rpc NotifyAttendees(NotifyRequest) returns (NotifyReply);
}

message NotifyRequest {
  string event_id = 1;
  int64 revision = 2;
  // "create", "update" or "cancel".
  string kind = 3;
  repeated string attendees = 4;
  // One token per (event, revision, kind): a retry of the same notification carries the same token.
  string idempotency_token = 5;
  string title = 6;
  // ISO-8601 instant of the first occurrence.
  string dtstart = 7;
}

message NotifyReply {
  // Attendees mailed by this request (0 when the token was already delivered).
  int32 mailed = 1;
}
