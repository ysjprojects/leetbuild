syntax = "proto3";

package returnsd;

// The warehouse step 3 asks to grade a returned item once it has arrived. An item the warehouse
// has not received is NOT_FOUND; a request it cannot grade (an unknown SKU) is INVALID_ARGUMENT.
// A slow or restarting warehouse answers DEADLINE_EXCEEDED or UNAVAILABLE.
service Warehouse {
  rpc GradeItem(GradeRequest) returns (GradeReply);
}

// The refund processor step 3 asks to pay a graded return. It accepts the refund (state
// "initiated") and settles it later; the outcome lands in the refund record the read serves.
service Refunds {
  rpc IssueRefund(RefundRequest) returns (RefundReply);
}

message GradeRequest {
  string return_id = 1;
  string sku = 2;
  int64 quantity = 3;
}

message GradeReply {
  string return_id = 1;
  // "sellable" or "damaged".
  string grade = 2;
}

message RefundRequest {
  string return_id = 1;
  int64 amount_cents = 2;
}

message RefundReply {
  string refund_id = 1;
  string state = 2;
}
