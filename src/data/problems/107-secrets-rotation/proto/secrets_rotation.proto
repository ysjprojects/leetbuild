syntax = "proto3";

package secretsrotation;

// A registered consumer of a secret, served at {consumer_id}:9000. Step 3 asks every consumer,
// before an old version retires, whether it can read the new one: can_read is false (with the
// version it does hold in version_id) while it still runs on another version.
service SecretConsumer {
  rpc CanReadVersion(CanReadRequest) returns (CanReadReply);
}

message CanReadRequest {
  string secret = 1;
  string version_id = 2;
  string fingerprint = 3;
}

message CanReadReply {
  string consumer_id = 1;
  string version_id = 2;
  bool can_read = 3;
}
