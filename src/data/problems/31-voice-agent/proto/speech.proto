syntax = "proto3";

package voice;

// The TTS provider the gateway streams an answer from (step 3). The harness serves it at tts:9000.
service Speech {
  rpc Synthesize(SynthesizeRequest) returns (stream AudioChunk);
}

message SynthesizeRequest {
  string session_id = 1;
  string text = 2;
  // The tokens of the answer the caller was already played: synthesis starts after them.
  int32 resume_offset = 3;
}

// The audio of one token of the answer.
message AudioChunk {
  // The tokens played once this chunk is: the index of the token it voices, plus one.
  int32 offset = 1;
  bytes audio = 2;
}
